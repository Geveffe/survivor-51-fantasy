<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge Pick · Survivor 51 Fantasy Tribe</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c1611">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:#0c1611; --surface:#13221a; --surface-2:#1a2d22; --line:#284033; --line-soft:#1f3328;
    --fg:#f1e9d6; --muted:#9db3a4; --faint:#6f8a7a;
    --gold:#e9b949; --torch:#e8743a; --up:#62d08f; --down:#ef6b5a;
    --radius:14px;
    --display:"Cinzel", Georgia, serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--gold); text-underline-offset:3px; }
  .container { max-width:720px; margin:0 auto; padding:32px 16px 48px; }
  .back { font-size:13px; color:var(--muted); }
  .eyebrow { font:600 12px/1 Inter, sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin:24px 0 8px; }
  h1 { font:700 clamp(26px, 4vw, 36px)/1.1 var(--display); margin:0; letter-spacing:.02em; }
  .sub { color:var(--muted); margin:8px 0 20px; }

  button, select { font:700 14px Inter, sans-serif; border-radius:999px; padding:8px 14px; cursor:pointer; border:1px solid transparent; }
  .primary { background:var(--gold); color:#1c1a15; }
  .primary:hover { filter:brightness(1.08); }
  .ghost { background:none; color:var(--fg); border-color:var(--line); font-weight:600; }
  .ghost:hover { border-color:var(--muted); }
  button:disabled { opacity:.6; cursor:default; filter:none; }
  select { background:var(--bg); color:var(--fg); border-color:var(--line); font-weight:600; min-width:0; }

  .notice { background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:16px; margin:0 0 16px; }
  .notice.ok { border-color:rgba(98,208,143,.45); }
  .notice.err { border-color:rgba(239,107,90,.45); }
  .notice b { color:var(--gold); }

  .panel { background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); }
  .row { padding:12px 14px; border-bottom:1px solid var(--line-soft); }
  .row:last-child { border-bottom:0; }
  .main { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
  .name { flex:1 1 120px; font-weight:700; }
  .saved { display:inline-block; margin-left:8px; font-size:12px; font-weight:700; color:var(--up); }
  .actions { display:flex; gap:8px; }
  .chooser { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chooser select { flex:1 1 160px; }
  .msg { font-size:14px; color:var(--muted); margin:8px 0 0; }
  .msg:empty { display:none; }
  .msg.err { color:var(--down); }
  .empty { color:var(--muted); padding:20px 14px; }
</style>
</head>
<body>
<main class="container">
  <a class="back" href="./">← Back to standings</a>
  <p class="eyebrow">Survivor 51 Fantasy Tribe</p>
  <h1>Merge Pick</h1>
  <p class="sub">Pick one castaway still in the game who isn't already on your tribe. We'll email you a link, and your pick is saved only when you click it.</p>

  <div class="notice" id="notice" hidden></div>
  <div class="panel" id="players"><p class="empty">Loading…</p></div>
</main>

<script>
  // The Google Apps Script web app URL from apps-script/MergePick.gs
  const API = 'https://script.google.com/macros/s/AKfycbyju2wPyiYeZuOM8PQTp2a5OfX-86JjJaFabusueIxB7riDcpCpSpAyU04LcFAianRf/exec';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function call(params) {
    if (!API) throw new Error("The merge pick service isn't set up yet.");
    const res = await fetch(`${API}?${new URLSearchParams(params)}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`The merge pick service said ${res.status}.`);
    const out = await res.json();
    if (!out.ok) throw new Error(out.error);
    return out;
  }

  function notice(html, kind) {
    const n = $('notice');
    n.innerHTML = html; n.className = `notice ${kind}`; n.hidden = false;
  }

  let players = [];
  function render() {
    $('players').innerHTML = players.map((p, i) => `
      <div class="row" data-i="${i}">
        <div class="main">
          <span class="name">${esc(p.name)}${p.hasPick ? '<span class="saved">✓ Pick saved</span>' : ''}</span>
          <span class="actions">
            <button class="primary" data-act="open">${p.hasPick ? 'Change' : 'Choose'} Merge Pick</button>
            <button class="ghost" data-act="email">Email Merge Pick</button>
          </span>
        </div>
        <form class="chooser" hidden>
          <select required aria-label="Merge pick for ${esc(p.name)}">
            <option value="">Choose a castaway…</option>
            ${p.eligible.map(c => `<option>${esc(c)}</option>`).join('')}
          </select>
          <button class="primary" type="submit">Email Me a Confirmation Link</button>
          <button class="ghost" type="button" data-act="close">Cancel</button>
        </form>
        <p class="msg" role="status"></p>
      </div>`).join('') || '<p class="empty">No players found.</p>';
  }

  async function load() {
    try {
      players = (await call({ action: 'status' })).players;
      render();
    } catch (err) {
      $('players').innerHTML = `<p class="empty">Couldn't load players. ${esc(err.message)}</p>`;
    }
  }

  // Run an action for one player, showing progress and the outcome under their name
  async function act(row, btn, params, done) {
    const msg = row.querySelector('.msg'), label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    msg.textContent = ''; msg.classList.remove('err');
    try {
      await call(params);
      msg.textContent = done;
      return true;
    } catch (err) {
      msg.textContent = err.message; msg.classList.add('err');
      return false;
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }

  $('players').addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    const row = btn.closest('.row'), p = players[row.dataset.i], form = row.querySelector('.chooser');
    if (btn.dataset.act === 'open') { form.hidden = false; form.querySelector('select').focus(); }
    if (btn.dataset.act === 'close') form.hidden = true;
    if (btn.dataset.act === 'email') {
      act(row, btn, { action: 'email', player: p.name }, `Sent ${p.name} an email with their current merge pick.`);
    }
  });

  $('players').addEventListener('submit', async ev => {
    ev.preventDefault();
    const form = ev.target, row = form.closest('.row'), p = players[row.dataset.i];
    const castaway = form.querySelector('select').value;
    const sent = await act(row, form.querySelector('button[type=submit]'), { action: 'choose', player: p.name, castaway },
      `Email sent to ${p.name}. ${castaway} becomes their merge pick once they click the link in it.`);
    if (sent) form.hidden = true;
  });

  // Arriving from a confirmation email: save the pick, then show the list as usual.
  // This runs in the page rather than straight from the link so email link scanners can't confirm picks.
  async function confirmFromLink() {
    const q = new URLSearchParams(location.search);
    if (!q.get('confirm')) return;
    history.replaceState(null, '', location.pathname);
    notice('Confirming your merge pick…', '');
    try {
      const r = await call({ action: 'commit', player: q.get('player'), token: q.get('confirm') });
      notice(`${r.already ? 'Already confirmed' : 'Confirmed'}: <b>${esc(r.castaway)}</b> is ${esc(r.player)}'s merge pick.`, 'ok');
    } catch (err) {
      notice(esc(err.message), 'err');
    }
  }

  confirmFromLink().then(load);
</script>
</body>
</html>
